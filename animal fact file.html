<!DOCTYPE html>
<html>

<head>
    <title>My Animal Fact File</title>
    <style>
        body {
            background-color: blue;
            font-family: Arial, sans-serif;
        }
        .fact-file {
            background-color: lightyellow;
            color: lightblue;
            width: 260px;
            padding: 25px;
            border: 4px solid darkblue;
            margin: 30px;
        }

        .animal-name {
            color: blue;
            font-size: 22px;
        }

        .detail {
            color: darkred;
        }

        .cool-fact {
            color: darkcyan;
            font-style: italic, bold;
        }
    </style>
</head>

<body>

    <div class="fact-file">
        <h2 class="animal-name">Lion:</h2>
        <p class="detail">Type: Big Cat</p>
        <p class="detail">Lives in: Africa, live in jungle</p>
        <p class="detail">Diet: Deer, goats, and wild animal</p>
        <p class="cool-fact">Cool Fact: King of jungle!</p>
    </div>

</body>

</html>
